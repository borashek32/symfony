version: '3.8'
networks:
  symfony-app-network:

services:
  nginx:
    container_name: symfony-nginx
    image: nginx:latest
    volumes:
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./:/var/www/
    ports:
      - '8080:80'
    depends_on:
      - app
    networks:
      - symfony-app-network

  app:
    container_name: symfony-app
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    volumes:
      - ./:/var/www/
    depends_on:
      - db
    networks:
      - symfony-app-network

  adminer:
    image: adminer
    container_name: symfony-adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8087:8080"
    depends_on:
      - db
    networks:
      - symfony-app-network

  db: 
    container_name: symfony-database
    image: mysql:8.0
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: symfony
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '8101:3306'
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    networks:
      - symfony-app-network

volumes:
  mysql_data: